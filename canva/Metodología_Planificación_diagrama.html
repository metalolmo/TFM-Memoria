<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Diagrama de Fases - TFM</title>
  <style>
    body{
      font-family: "Times New Roman", Georgia, serif;
      background: #fff;
      margin:0; padding:20px;
      display:flex; flex-direction:column; align-items:center;
      color:#111;
    }
    .container{
      max-width: 1000px;
      width:100%;
      border:1px solid #000;
      padding:20px;
      background:#fff;
    }
    .row{
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 20px;
      gap:12px;
      flex-wrap:wrap;
    }
    .phase{
      flex:0 0 auto;
      border:1px solid #000;
      border-radius:6px;
      padding:14px 20px;
      width:200px;
      text-align:center;
      font-weight:bold;
      font-size:14px;
      line-height:1.25;
    }
    /* Paleta sobria por tipo de fase */
    .analysis  { background:#e6eef9; border-color:#1f3b64; }  /* azul muy claro */
    .design    { background:#e9f3e6; border-color:#3b5f2a; }  /* verde muy claro */
    .backend   { background:#f2ece6; border-color:#624a2e; }  /* sepia claro */
    .frontend  { background:#f1e8f7; border-color:#583c7c; }  /* violeta muy claro */
    .testing   { background:#f7f1e8; border-color:#6a4d1f; }  /* ámbar claro */
    .docs      { background:#eef0f2; border-color:#333; }     /* gris claro */

    .arrow{
      width:40px;
      display:flex; align-items:center; justify-content:center;
    }
    .arrow svg{ width:100%; height:12px; }
    .download-btn{
      margin-bottom:15px;
      border:1px solid #000;
      background:#fff;
      padding:6px 12px;
      cursor:pointer;
      font-size:13px;
    }
    @media print{
      .download-btn{ display:none; }
    }

    /* Leyenda (dentro del contenedor para que se exporte) */
    .legend{
      margin-top:10px;
      padding-top:12px;
      border-top:1px solid #000;
      display:flex; flex-wrap:wrap; gap:14px;
      font-size:13px;
    }
    .legend-item{
      display:flex; align-items:center; gap:8px;
    }
    .swatch{
      width:18px; height:12px; border:1px solid #000;
    }
    .swatch.analysis{ background:#e6eef9; border-color:#1f3b64; }
    .swatch.design  { background:#e9f3e6; border-color:#3b5f2a; }
    .swatch.backend { background:#f2ece6; border-color:#624a2e; }
    .swatch.frontend{ background:#f1e8f7; border-color:#583c7c; }
    .swatch.testing { background:#f7f1e8; border-color:#6a4d1f; }
    .swatch.docs    { background:#eef0f2; border-color:#333; }
  </style>
</head>
<body>
  <!-- Botón fuera del diagrama -->
  <button class="download-btn" onclick="downloadDiagram()">Descargar PNG</button>

  <!-- SOLO el diagrama (incluye leyenda para exportación) -->
  <div class="container" id="diagram">
    <!-- Fila 1 -->
    <div class="row">
      <div class="phase analysis">Análisis de requisitos</div>
      <div class="arrow">
        <svg viewBox="0 0 60 12" aria-hidden="true">
          <line x1="0" y1="6" x2="52" y2="6" stroke="#000" stroke-width="1.5"/>
          <polygon points="60,6 52,10 52,2" fill="#000"/>
        </svg>
      </div>
      <div class="phase design">Diseño del sistema</div>
      <div class="arrow">
        <svg viewBox="0 0 60 12" aria-hidden="true">
          <line x1="0" y1="6" x2="52" y2="6" stroke="#000" stroke-width="1.5"/>
          <polygon points="60,6 52,10 52,2" fill="#000"/>
        </svg>
      </div>
      <div class="phase backend">Desarrollo del backend</div>
    </div>

    <!-- Fila 2 -->
    <div class="row">
      <div class="phase frontend">Desarrollo del frontend</div>
      <div class="arrow">
        <svg viewBox="0 0 60 12" aria-hidden="true">
          <line x1="0" y1="6" x2="52" y2="6" stroke="#000" stroke-width="1.5"/>
          <polygon points="60,6 52,10 52,2" fill="#000"/>
        </svg>
      </div>
      <div class="phase testing">Pruebas y validación</div>
      <div class="arrow">
        <svg viewBox="0 0 60 12" aria-hidden="true">
          <line x1="0" y1="6" x2="52" y2="6" stroke="#000" stroke-width="1.5"/>
          <polygon points="60,6 52,10 52,2" fill="#000"/>
        </svg>
      </div>
      <div class="phase docs">Documentación</div>
    </div>

    <!-- Leyenda de colores -->
    <div class="legend" aria-label="Leyenda de colores">
      <div class="legend-item"><span class="swatch analysis"></span> Análisis de requisitos</div>
      <div class="legend-item"><span class="swatch design"></span> Diseño del sistema</div>
      <div class="legend-item"><span class="swatch backend"></span> Desarrollo del backend</div>
      <div class="legend-item"><span class="swatch frontend"></span> Desarrollo del frontend</div>
      <div class="legend-item"><span class="swatch testing"></span> Pruebas y validación</div>
      <div class="legend-item"><span class="swatch docs"></span> Documentación</div>
    </div>
  </div>

  <!-- Script para exportar como PNG -->
  <script>
    function loadHtml2Canvas(cb){
      if(window.html2canvas) return cb();
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      s.onload=cb;
      document.head.appendChild(s);
    }
    function downloadDiagram(){
      const el=document.getElementById('diagram');
      loadHtml2Canvas(()=>{
        html2canvas(el,{backgroundColor:'#ffffff',scale:2}).then(canvas=>{
          const link=document.createElement('a');
          link.download='diagrama-fases-tfm.png';
          link.href=canvas.toDataURL('image/png');
          link.click();
        });
      });
    }
  </script>
</body>
</html>
